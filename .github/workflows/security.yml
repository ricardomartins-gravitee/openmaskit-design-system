name: Security scans

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Gitleaks full-history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          : > "$RUNNER_TEMP/gitleaks.ignore"
          set +e
          "$RUNNER_TEMP/gitleaks" git \
            --config .gitleaks.toml \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks.ignore" \
            --ignore-gitleaks-allow \
            --redact=100 \
            --report-format=json \
            --report-path "$RUNNER_TEMP/gitleaks-report.json" \
            --log-level=error \
            --no-banner \
            --timeout=300 \
            "$GITHUB_WORKSPACE"
          scan_rc=$?
          set -e
          if [[ "$scan_rc" -eq 1 ]]; then
            python3 - "$RUNNER_TEMP/gitleaks-report.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as report_file:
              findings = json.load(report_file)
          rules = sorted({finding.get("RuleID", "unknown") for finding in findings})
          print(f"Gitleaks found {len(findings)} secret finding(s); values and file contents withheld.")
          print("Rule IDs: " + (", ".join(rules) if rules else "unavailable"))
          PY
          fi
          exit "$scan_rc"
      - name: Verify scanner still rejects synthetic credentials
        run: python3 scripts/test_secret_scanner.py "$RUNNER_TEMP/gitleaks"
