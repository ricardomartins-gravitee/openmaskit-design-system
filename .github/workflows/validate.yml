name: Design system validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tokens:
    name: Tokens and generation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - run: uv sync --frozen --no-build --python 3.12
      - run: uv run --frozen --no-sync ruff check scripts tests
      - run: uv run --frozen --no-sync ruff format --check scripts tests
      - run: python3 scripts/build.py --check
      - run: uv run --frozen --no-sync coverage run --branch --include="*/scripts/build.py" -m unittest discover -s tests -v
      - run: uv run --frozen --no-sync coverage report --fail-under=85
  browser:
    name: Chromium and WebKit acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - run: uv sync --frozen --no-build --python 3.12
      - run: uv run --frozen --no-sync playwright install --with-deps chromium webkit
      - run: uv run --frozen --no-sync python scripts/test_browser.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component-browser-screenshots
          path: .runtime/browser/
          retention-days: 14
  native:
    name: Native components (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift format lint --strict --recursive Sources tests Package.swift
      - run: swift test
